services:
  - type: web
    name: sanchar-dashboard-api
    env: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WS_PORT
        value: 8080
      - key: API_PORT
        value: 10000
